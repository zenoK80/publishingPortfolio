<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; }

.weatherContainer {
  width: 100%;
  height: 100vh;
  background-image: url('../../../images/react-weather-bg.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 28px;
}

.weatherBox {
  width: 420px;
  max-width: 90vw;
  padding: 45px 30px;
  border-radius: 24px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.18);
}

.weatherBox div { font-size: 2rem; font-weight: 600; margin-bottom: 20px; }
.weatherBox h2 { font-size: 4rem; font-weight: 700; line-height: 1.2; margin-bottom: 20px; }
.weatherBox h3 { font-size: 1.5rem; text-transform: capitalize; opacity: 0.9; }

.buttonGroup {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.buttonGroup button {
  min-width: 120px;
  border-radius: 14px !important;
  font-weight: 600 !important;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  transition: all 0.2s ease;
}

.buttonGroup button:hover { transform: translateY(-2px); }

.spinner {
  width: 150px;
  height: 150px;
  border: 10px solid rgba(248, 140, 107, 0.25);
  border-top-color: #f88c6b;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect } = React;

// Open-Meteo API — API 키가 필요 없는 무료 날씨 API
// 정적 페이지는 키를 숨길 수 없어서, 키 없는 API를 사용
const WEATHER_CODES = {
  0: 'clear sky',        1: 'mainly clear',      2: 'partly cloudy',   3: 'overcast',
  45: 'fog',             48: 'rime fog',
  51: 'light drizzle',   53: 'drizzle',          55: 'dense drizzle',
  56: 'freezing drizzle',57: 'freezing drizzle',
  61: 'slight rain',     63: 'rain',             65: 'heavy rain',
  66: 'freezing rain',   67: 'heavy freezing rain',
  71: 'slight snow',     73: 'snow',             75: 'heavy snow',     77: 'snow grains',
  80: 'rain showers',    81: 'rain showers',     82: 'violent showers',
  85: 'snow showers',    86: 'heavy snow showers',
  95: 'thunderstorm',    96: 'thunderstorm with hail', 99: 'thunderstorm with hail'
};

function WeatherBox({ weather }) {
  return (
    <div className="weatherBox">
      <div>{weather?.name}</div>
      <h2>{weather?.temp}°C / {((weather?.temp * 9) / 5 + 32).toFixed(1)}°F</h2>
      <h3>{weather?.description}</h3>
    </div>
  );
}

function WeatherButton({ cities, setCity, city, getCurrentLocation }) {
  return (
    <div className="buttonGroup">
      <button
        className={`btn btn-lg ${city === "" ? "btn-warning" : "btn-light"}`}
        onClick={() => { setCity(""); getCurrentLocation(); }}
      >
        Current Location
      </button>
      {cities.map((item, index) => (
        <button
          key={index}
          className={`btn btn-lg ${city === item ? "btn-warning" : "btn-light"}`}
          onClick={() => setCity(item)}
        >
          {item}
        </button>
      ))}
    </div>
  );
}

function Weather() {
  const [weather, setWeather] = useState(null);
  const cities = ['paris', 'new york', 'tokyo', 'seoul'];
  const [city, setCity] = useState('');
  const [loading, setLoading] = useState(true);

  const getCurrentLocation = () => {
    if (!navigator.geolocation) {
      setCity('seoul');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (position) => {
        let lat = position.coords.latitude;
        let lon = position.coords.longitude;
        getWeatherByCurrentLocation(lat, lon);
      },
      () => {
        setCity('seoul');
      },
      { timeout: 5000 }
    );
  };

  // 좌표 → 현재 날씨 (Open-Meteo, 키 불필요)
  const fetchWeather = async (lat, lon, name) => {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`;
    const response = await fetch(url);
    const data = await response.json();

    setWeather({
      name,
      temp: data.current.temperature_2m,
      description: WEATHER_CODES[data.current.weather_code] || 'unknown'
    });
    setLoading(false);
  };

  const getWeatherByCurrentLocation = async (lat, lon) => {
    let name = 'Current Location';

    // 좌표 → 도시명 (실패해도 날씨는 정상 표시)
    try {
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
      const geo = await res.json();
      name = geo.city || geo.locality || geo.principalSubdivision || name;
    } catch (err) {
      console.warn('Reverse geocoding failed:', err);
    }

    await fetchWeather(lat, lon, name);
  };

  // 도시명 → 좌표 (Open-Meteo Geocoding, 키 불필요)
  const getWeatherByCity = async () => {
    const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
    const geoRes = await fetch(geoUrl);
    const geoData = await geoRes.json();

    const place = geoData.results?.[0];
    if (!place) {
      setLoading(false);
      return;
    }

    await fetchWeather(place.latitude, place.longitude, place.name);
  };

  useEffect(() => {
    if (city === "") {
      getCurrentLocation();
    } else {
      getWeatherByCity();
    }
  }, [city]);

  return (
    <div className="weatherContainer">
      <div className="container">
        {loading ? (
          <div className="spinner"></div>
        ) : (
          <>
            <WeatherBox weather={weather} />
            <WeatherButton cities={cities} setCity={setCity} city={city} getCurrentLocation={getCurrentLocation} />
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Weather />);
</script>
</body>
</html>
